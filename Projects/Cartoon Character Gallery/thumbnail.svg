<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020306" />
      <stop offset="50%" stop-color="#060914" />
      <stop offset="100%" stop-color="#0d1122" />
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ff2975" />
    </linearGradient>

    <filter id="panelGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.03"/>
    </filter>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(148, 163, 184, 0.015)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="url(#gridPattern)" />

  <circle cx="680" cy="100" r="180" fill="#00f0ff" opacity="0.025" filter="blur(60px)" />
  <circle cx="120" cy="420" r="160" fill="#ff2975" opacity="0.025" filter="blur(50px)" />

  <g transform="translate(40, 30)" filter="url(#panelGlow)">
    <rect width="720" height="440" rx="16" fill="#0f172a" stroke="rgba(148, 163, 184, 0.08)" stroke-width="1.5"/>

    <circle cx="20" cy="20" r="5" fill="#ef4444" opacity="0.7"/>
    <circle cx="36" cy="20" r="5" fill="#f59e0b" opacity="0.7"/>
    <circle cx="52" cy="20" r="5" fill="#10b981" opacity="0.7"/>

    <g transform="translate(560, 12)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="url(#brandGrad)" />
      <text x="22" y="11" font-family="'Orbitron',monospace" font-size="10" font-weight="900" fill="#e8e8f0" letter-spacing="0.1em">CARTOON_GALLERY</text>
    </g>

    <!-- Search bar -->
    <rect x="180" y="42" width="340" height="30" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <circle cx="198" cy="57" r="6" fill="none" stroke="#55556a" stroke-width="1.5"/>
    <line x1="203" y1="62" x2="208" y2="67" stroke="#55556a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Filter chips -->
    <rect x="40" y="84" width="100" height="24" rx="12" fill="rgba(0,240,255,0.08)" stroke="#00f0ff" stroke-width="0.8" opacity="0.6"/>
    <text x="90" y="99" font-family="monospace" font-size="7" fill="#00f0ff" text-anchor="middle" font-weight="600">ALL UNIVERSES</text>

    <rect x="150" y="84" width="90" height="24" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
    <text x="195" y="99" font-family="monospace" font-size="7" fill="#8888a0" text-anchor="middle">90s NOSTALGIA</text>

    <rect x="250" y="84" width="90" height="24" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
    <text x="295" y="99" font-family="monospace" font-size="7" fill="#8888a0" text-anchor="middle">MODERN ANIME</text>

    <rect x="350" y="84" width="90" height="24" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
    <text x="395" y="99" font-family="monospace" font-size="7" fill="#8888a0" text-anchor="middle">SCI-FI CARTOONS</text>

    <!-- Card 1 -->
    <g transform="translate(40, 120)">
      <rect width="150" height="190" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="0" y="0" width="150" height="108" rx="10" fill="#0a0b14"/>
      <rect x="0" y="96" width="150" height="12" rx="6" fill="#ff2975" opacity="0.15"/>
      <text x="75" y="56" font-family="'Inter',sans-serif" font-size="28" fill="#55556a" text-anchor="middle" font-weight="700">B</text>
      <text x="75" y="138" font-family="'Inter',sans-serif" font-size="11" fill="#e8e8f0" text-anchor="middle" font-weight="700">Bugs Bunny</text>
      <text x="75" y="152" font-family="'Inter',sans-serif" font-size="7" fill="#8888a0" text-anchor="middle">Trickster Rabbit</text>
      <text x="75" y="172" font-family="monospace" font-size="7" fill="#00f0ff" text-anchor="middle" font-style="italic">"What's up, doc?"</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(205, 120)">
      <rect width="150" height="190" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="0" y="0" width="150" height="108" rx="10" fill="#0a0b14"/>
      <rect x="0" y="96" width="150" height="12" rx="6" fill="#ff2975" opacity="0.15"/>
      <text x="75" y="56" font-family="'Inter',sans-serif" font-size="28" fill="#55556a" text-anchor="middle" font-weight="700">N</text>
      <text x="75" y="138" font-family="'Inter',sans-serif" font-size="11" fill="#e8e8f0" text-anchor="middle" font-weight="700">Naruto</text>
      <text x="75" y="152" font-family="'Inter',sans-serif" font-size="7" fill="#8888a0" text-anchor="middle">Ninja &amp; Hokage</text>
      <text x="75" y="172" font-family="monospace" font-size="7" fill="#a855f7" text-anchor="middle" font-style="italic">"Believe it!"</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(370, 120)">
      <rect width="150" height="190" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="0" y="0" width="150" height="108" rx="10" fill="#0a0b14"/>
      <rect x="0" y="96" width="150" height="12" rx="6" fill="#00f0ff" opacity="0.12"/>
      <text x="75" y="56" font-family="'Inter',sans-serif" font-size="28" fill="#55556a" text-anchor="middle" font-weight="700">R</text>
      <text x="75" y="138" font-family="'Inter',sans-serif" font-size="11" fill="#e8e8f0" text-anchor="middle" font-weight="700">Rick Sanchez</text>
      <text x="75" y="152" font-family="'Inter',sans-serif" font-size="7" fill="#8888a0" text-anchor="middle">Mad Scientist</text>
      <text x="75" y="172" font-family="monospace" font-size="7" fill="#00f0ff" text-anchor="middle" font-style="italic">"Wubba lubba dub!"</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(535, 120)">
      <rect width="150" height="190" rx="10" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="0" y="0" width="150" height="108" rx="10" fill="#0a0b14"/>
      <rect x="0" y="96" width="150" height="12" rx="6" fill="#a855f7" opacity="0.15"/>
      <text x="75" y="56" font-family="'Inter',sans-serif" font-size="28" fill="#55556a" text-anchor="middle" font-weight="700">G</text>
      <text x="75" y="138" font-family="'Inter',sans-serif" font-size="11" fill="#e8e8f0" text-anchor="middle" font-weight="700">Goku</text>
      <text x="75" y="152" font-family="'Inter',sans-serif" font-size="7" fill="#8888a0" text-anchor="middle">Saiyan Warrior</text>
      <text x="75" y="172" font-family="monospace" font-size="7" fill="#a855f7" text-anchor="middle" font-style="italic">"Over 9000!"</text>
    </g>

    <!-- Telemetry bar -->
    <rect x="40" y="326" width="640" height="28" rx="6" fill="#0a0b14" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="160" y="344" font-family="monospace" font-size="7" fill="#55556a" text-anchor="middle">DISPLAYED</text>
    <text x="160" y="353" font-family="'Orbitron',monospace" font-size="12" fill="#00f0ff" text-anchor="middle" font-weight="700">4</text>
    <line x1="280" y1="332" x2="280" y2="348" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="360" y="344" font-family="monospace" font-size="7" fill="#55556a" text-anchor="middle">TOTAL</text>
    <text x="360" y="353" font-family="'Orbitron',monospace" font-size="12" fill="#00f0ff" text-anchor="middle" font-weight="700">12</text>
    <line x1="440" y1="332" x2="440" y2="348" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="540" y="344" font-family="monospace" font-size="7" fill="#55556a" text-anchor="middle">ACTIVE FILTER</text>
    <text x="540" y="353" font-family="'Orbitron',monospace" font-size="10" fill="#00f0ff" text-anchor="middle" font-weight="700">ALL</text>

    <!-- Footer tech badges -->
    <g transform="translate(40, 400)">
      <rect x="0" y="0" width="58" height="18" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
      <text x="29" y="12" font-family="monospace" font-size="7" fill="#8888a0" text-anchor="middle" font-weight="600">HTML5</text>
      <rect x="66" y="0" width="52" height="18" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
      <text x="92" y="12" font-family="monospace" font-size="7" fill="#8888a0" text-anchor="middle" font-weight="600">CSS3</text>
      <rect x="126" y="0" width="52" height="18" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>
      <text x="152" y="12" font-family="monospace" font-size="7" fill="#8888a0" text-anchor="middle" font-weight="600">ES6+</text>

      <text x="640" y="12" font-family="monospace" font-size="7" fill="#55556a" text-anchor="end">CARTOON_GALLERY v1.0</text>
    </g>
  </g>
</svg>
